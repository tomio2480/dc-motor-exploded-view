name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型検査・lint・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, format check and unit tests
        run: npm run check

      - name: Build
        run: npm run build

  complexity:
    name: 複雑度の検査（cccc）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # cccc は版を固定し，配布物の SHA-256 を照合してから使う．
      # 版を上げるときは，scripts/check-complexity.mjs の版と採点の差分も確かめる．
      - name: Install cccc
        env:
          CCCC_VERSION: v1.9.2
          CCCC_SHA256: eb964d5fa9daa8cb557499722865cd89cbd77764485899ddce4e0a5a2cb667a5
        run: |
          archive="cccc-${CCCC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/moznion/cccc/releases/download/${CCCC_VERSION}/${archive}"
          echo "${CCCC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cccc"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/cccc" cccc
          echo "${RUNNER_TEMP}/cccc" >> "${GITHUB_PATH}"

      # 指標: 認知的複雑度（上限 15）と循環的複雑度（上限 10）．
      # 閾値と数え方の出典は scripts/check-complexity.mjs に記す．
      - name: Check complexity
        run: npm run complexity

  # E2E のジョブで使うコンテナの版を，導入している @playwright/test の版へ合わせる．
  playwright-version:
    name: Playwright の版の取得
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the installed version from the lockfile
        id: read
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  e2e:
    name: E2E・アクセシビリティ検査（${{ matrix.browser }}）
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ブラウザーと依存ライブラリを導入済みの，Playwright の公式コンテナで実行する．
    # 実行のたびに apt で導入すると，配布元が遅いときにジョブが終わらないためである．
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Chromium が共有メモリの不足で落ちないようにする．
      options: --ipc=host
    env:
      # コンテナは root で動く．Firefox は HOME の所有者が実行者と異なると起動しない．
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        # webkit は Safari と同じ描画エンジンである．
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GPU のない実行環境では，画面なしの Firefox が WebGL を作れない．
      # 仮想画面の上で実行し，Firefox だけ画面ありで起動する．
      - name: Run E2E tests with axe-core
        env:
          BROWSER: ${{ matrix.browser }}
          E2E_FIREFOX_HEADED: "1"
        run: xvfb-run --auto-servernum npm run test:e2e -- --trace off --project="${BROWSER}-*"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
